# ============================================================
# CloudVault Migrator - Spring Boot Configuration
# ============================================================

spring.application.name=cloudvault-migrator

# ------------------------------------------------------------
# DATABASE - H2 for local dev (switch to PostgreSQL for prod)
# ------------------------------------------------------------
# To use H2 (in-memory, for rapid local development):
spring.datasource.url=jdbc:h2:file:./data/cloudvaultdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To switch to PostgreSQL, comment out H2 section above and uncomment:
# spring.datasource.url=jdbc:postgresql://localhost:5432/cloudvaultdb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL: spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------
# GOOGLE OAUTH 2.0 CREDENTIALS
# NEVER hardcode these. Read from environment variables.
# ------------------------------------------------------------
google.oauth.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
google.oauth.redirect-uri=http://localhost:9090/api/oauth/callback

# Google OAuth scopes required
google.oauth.scopes=https://www.googleapis.com/auth/drive,https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/userinfo.profile

# ------------------------------------------------------------
# SERVER CONFIG
# ------------------------------------------------------------
server.port=9090

# ------------------------------------------------------------
# CORS - Allow only the React dev server
# ------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

# ------------------------------------------------------------
# TOKEN ENCRYPTION - AES key for encrypting OAuth tokens at rest
# Must be exactly 32 characters for AES-256
# ------------------------------------------------------------
app.token.encryption-key=${TOKEN_ENCRYPTION_KEY:cloudvaultdefaultkey1234567890ab}

# ------------------------------------------------------------
# TRANSFER SETTINGS
# ------------------------------------------------------------
app.transfer.max-retries=3
app.transfer.retry-base-delay-ms=2000
app.transfer.max-concurrent-transfers=3

# ------------------------------------------------------------
# LOGGING - Never log OAuth tokens
# ------------------------------------------------------------
logging.level.com.cloudmigration=INFO
logging.level.com.google=WARN
logging.level.org.springframework.security=WARN
